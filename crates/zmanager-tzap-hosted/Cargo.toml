[package]
name = "zmanager-tzap-hosted"
version.workspace = true
description = "Hosted TZAP account, enrollment, status, and service integration for ZManager."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[features]
default = []
reqwest-transport = ["dep:reqwest"]

[dependencies]
base64 = "0.22.1"
num-bigint = "0.4.6"
openssl = "0.10.80"
rand = "0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.8"
time = { version = "0.3.47", features = ["parsing"] }
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"], optional = true }
x509-parser = "0.18.1"
zmanager-core = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
base64 = "0.22.1"
openssl = "0.10.80"
serde_json = "1.0.140"
sha2 = "0.10.8"
serde_json_canonicalizer = "0.3.2"
x509-parser = "0.18.1"
