[package]
name = "zmanager-libarchive-sys"
version.workspace = true
description = "Raw libarchive FFI bindings and build-time bundling for ZManager"
edition = "2021"
license.workspace = true
repository.workspace = true
readme = "README.md"
links = "archive"
build = "build.rs"

[lib]
path = "src/lib.rs"

[dependencies]
libc = "0.2.186"

[build-dependencies]
cmake = "0.1.58"
pkg-config = "0.3.32"
bindgen = "0.72"

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = "warn"
pedantic = "warn"

[target.'cfg(target_os = "macos")'.dependencies]
lz4-sys = "1.9.4"
zstd-sys = "2.0.16"

# On musl the crate's own xz build would enter the static link alongside the
# system xz-static archive (which libarchive's cmake links): two copies of
# liblzma, and both pull riscv.o — duplicate lzma_bcj_riscv_* symbols. There
# we link the system liblzma only; elsewhere (apple, glibc, windows, android)
# the bundled xz is built statically.
[target.'cfg(not(target_env = "musl"))'.dependencies]
liblzma-sys = { package = "lzma-sys", version = "0.1", features = ["static"] }

[target.'cfg(target_env = "musl")'.dependencies]
liblzma-sys = { package = "lzma-sys", version = "0.1" }
