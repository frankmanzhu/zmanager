[package]
name = "zmanager-ffi"
version.workspace = true
description = "UniFFI-based FFI bindings for ZManager, exposing the core archive engine to Swift, Kotlin, and Python."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]
name = "zmanager_ffi"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.8"
thiserror = "2"
uniffi = { version = "0.29", features = ["cli"] }
zmanager-core = { workspace = true }
zmanager-tzap-hosted = { workspace = true, optional = true }

[features]
default = ["tzap-online"]
tzap-online = ["dep:zmanager-tzap-hosted"]

# The bridge crate inherits the workspace lint policy by spelling it out:
# Cargo forbids overriding a lint group while `workspace = true`.
[lints.rust]
# UniFFI-generated scaffolding uses `#[unsafe(no_mangle)]`; the handwritten
# bridge code contains no `unsafe` (enforced by review and grep audits).
unsafe_code = "allow"

[lints.clippy]
all = "warn"
# Pedantic parity with the workspace is tracked separately (CR-176): the
# bridge crate historically had no [lints] section, so enabling pedantic here
# surfaces a ~112-warning backlog in one step.

[build-dependencies]
uniffi = { version = "0.29", features = ["build"] }

[dev-dependencies]
# OpenSSL-removal branch (OR-102): keep one copy of each tzap crate by
# matching zmanager-core's git pins; revert to crates.io on release.
tzap-core = { git = "https://github.com/tzap-org/tzap", branch = "openssl-removal", version = "0.2.2" }
tzap-plugin-signing = { git = "https://github.com/tzap-org/tzap", branch = "openssl-removal", version = "0.2.2" }
