[package]
name = "zmanager-ffi"
version.workspace = true
description = "UniFFI-based FFI bindings for ZManager, exposing the core archive engine to Swift, Kotlin, and Python."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]
name = "zmanager_ffi"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.8"
thiserror = "2"
uniffi = { version = "0.29", features = ["cli"] }
zmanager-core = { workspace = true }

[features]
default = ["tzap-online"]
tzap-online = ["zmanager-core/tzap-online"]

[build-dependencies]
uniffi = { version = "0.29", features = ["build"] }

[dev-dependencies]
tzap-core = "0.2.2"
tzap-plugin-signing = "0.2.2"
