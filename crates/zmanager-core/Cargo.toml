[package]
name = "zmanager-core"
version.workspace = true
description = "Core archive, offline identity, and policy engine for ZManager."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[lib]
path = "src/lib.rs"

[features]
default = []

[dependencies]
# Already reachable through the `zip`/`flate2` trees; direct deps for the
# lzop decoder's header/block checksums.
adler2 = "2.0.1"
base64 = "0.22.1"
brotli = "8.0.2"
crc32fast = "1.5.0"
bzip2 = "0.6.1"
cab = "0.6.0"
msi = "0.10.0"
der = "0.8"
# RustCrypto signing stack (OpenSSL removal OR-200/201): the 0.14 curve line
# pairs with ecdsa 0.17 / signature 3.x, matching tzap-plugin-signing.
ecdsa = { version = "0.17", features = ["der"] }
filetime = "0.2.29"
flate2 = "1.1.9"
getrandom = "0.3"
hex = "0.4"
lz4_flex = "0.14.0"
lzma-rust2 = { version = "0.16.2", default-features = false, features = ["lzip", "std", "xz"] }
# Pure-Rust LZO1X block decompressor (SecurityRonin family, Apache-2.0);
# the lzop container framing around the blocks lives in `lzop_decoder.rs`.
lzo = "0.1.3"
num-bigint = "0.4.6"
# PKCS#12 import only: the single allow-listed OpenSSL surface in core
# (implementation-docs/adr/2026-08-15-chain-verification-backend.md). Vendored,
# so no system OpenSSL is required on any target.
openssl = { version = "0.10.80", features = ["vendored"] }
p256 = { version = "0.14", features = ["ecdsa", "pkcs8"] }
pkcs8 = { version = "0.11", features = ["std"] }
rand = "0.9.0"
rand_core = "0.10"
signature3 = { package = "signature", version = "3" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.140"
serde_json_canonicalizer = "0.3.2"
sha2 = "0.10.8"
time = { version = "0.3.47", features = ["parsing"] }
x509-cert = "0.2.5"
x509-parser = "0.18.1"
x509-verify = "0.4"
sevenz-rust2 = { version = "0.21.0", default-features = false, features = ["aes256", "compress", "util"] }
tar = "0.4.45"
# OpenSSL-removal branch (OR-102): the tzap crates are pinned to the
# `openssl-removal` branch until it merges upstream and releases. tzap-core is
# pinned to the same source so the git plugins and zmanager share one copy
# (cargo resolves the plugins' workspace path-dep to the git source). Switch
# back to crates.io versions at release time (the dpp fork precedent).
tzap-core = { git = "https://github.com/tzap-org/tzap", branch = "openssl-removal", version = "0.2.2" }
tzap-plugin-keywrap = { git = "https://github.com/tzap-org/tzap", branch = "openssl-removal", version = "0.2.2" }
tzap-plugin-signing = { git = "https://github.com/tzap-org/tzap", branch = "openssl-removal", version = "0.2.2" }
zip = "8.6.0"
zeroize = "1.8.2"
zmanager-unrar = { workspace = true }

zstd = { version = "0.13.3", features = ["zstdmt"] }
# Patched fork: APFS symlink target support (upstream PR https://github.com/Dil4rd/dpp/pull/4).
# Switch back to `dpp = "0.4.2"` once upstream releases the fix.
dpp = { git = "https://github.com/frankmanzhu/dpp", branch = "fix-apfs-symlink-xattr" }
delharc = { version = "0.8.0", default-features = false, features = ["std", "lh1", "lz", "lhx"] }
warc = { version = "0.4.0", default-features = false }
# Forensic disk-image stack: VHD/VMDK containers, MBR/GPT volume systems, and
# NTFS/FAT/ext4/UDF filesystems (SecurityRonin family, Apache-2.0/MIT, read-only).
# Path dependency on the sibling checkout so engine/adapter bugs can be patched
# locally and pushed to https://github.com/frankmanzhu/forensic-vfs-engine with an
# upstream PR — the dpp precedent. Switch back to crates.io when the family
# stabilizes: drop the `path` key and keep `version = "0.1"` (relax the exact pin).
forensic-vfs-engine = { path = "../../../forensic-vfs-engine", version = "=0.1.10" }
# The engine does not re-export the contract types (FileSystem, FsKind, ...);
# same floor as the engine so cargo unifies to one copy.
forensic-vfs = "0.7"
iso = { version = "0.7.1", package = "iso9660-forensic" }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
zmanager-apple-archive = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
mtree = "0.5.0"

[target.'cfg(unix)'.dev-dependencies]
xattr = "1.6.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Threading",
] }

[dev-dependencies]
crc32c = "0.6"

[lints]
workspace = true
