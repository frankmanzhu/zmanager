[package]
name = "zmanager-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

# Resolve the tzap crates from the sibling snapshot (same `[patch.crates-io]`
# as the workspace root), so the fuzz targets exercise the same tzap code the
# rest of zmanager builds against instead of the crates.io release.
[patch.crates-io]
tzap-core = { path = "../../tzap/crates/tzap-core" }
tzap-plugin-keywrap = { path = "../../tzap/crates/tzap-plugin-keywrap" }
tzap-plugin-signing = { path = "../../tzap/crates/tzap-plugin-signing" }

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tzap-core = "0.2.1"
zip = "8.6.0"
zmanager-core = { path = "../crates/zmanager-core" }

[[bin]]
name = "path_normalization"
path = "fuzz_targets/path_normalization.rs"
test = false
doc = false
bench = false

[[bin]]
name = "zip_metadata"
path = "fuzz_targets/zip_metadata.rs"
test = false
doc = false
bench = false

[[bin]]
name = "libarchive_input"
path = "fuzz_targets/libarchive_input.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tzap_footer_inspect"
path = "fuzz_targets/tzap_footer_inspect.rs"
test = false
doc = false
bench = false
