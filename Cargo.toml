[workspace]
members = [
    "crates/zmanager-apple-archive",
    "crates/zmanager-cli",
    "crates/zmanager-core",
    "crates/zmanager-ffi",
    "crates/zmanager-libarchive",
    "crates/zmanager-libarchive-sys",
    "crates/zmanager-unrar",
]
resolver = "2"

[workspace.package]
version = "2.0.1"
edition = "2024"
# Floor set by the forensic-vfs-engine sibling (rust-version = "1.93"); keep in
# sync with the engine's declared MSRV when the family updates.
rust-version = "1.93"
license = "Apache-2.0"
repository = "https://github.com/tzap-org/zmanager"
readme = "README.md"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[workspace.dependencies]
zmanager-apple-archive = { path = "crates/zmanager-apple-archive", version = "2.0.1" }
zmanager-cli = { path = "crates/zmanager-cli", version = "2.0.1" }
zmanager-core = { path = "crates/zmanager-core", version = "2.0.1" }
zmanager-ffi = { path = "crates/zmanager-ffi", version = "2.0.1" }
zmanager-libarchive = { path = "crates/zmanager-libarchive", version = "2.0.1" }
zmanager-libarchive-sys = { path = "crates/zmanager-libarchive-sys", version = "2.0.1" }
zmanager-unrar = { path = "crates/zmanager-unrar", version = "2.0.1" }


