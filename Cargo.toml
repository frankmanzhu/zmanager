[workspace]
members = [
    "crates/zmanager-apple-archive",
    "crates/zmanager-cli",
    "crates/zmanager-core",
    "crates/zmanager-ffi",
    "crates/zmanager-tzap-hosted",
    "crates/zmanager-unrar",
]
resolver = "2"

[workspace.package]
version = "2.1.0"
edition = "2024"
# Floor set by the forensic-vfs-engine sibling (rust-version = "1.93"); keep in
# sync with the engine's declared MSRV when the family updates.
rust-version = "1.93"
license = "Apache-2.0"
repository = "https://github.com/tzap-org/zmanager"
readme = "README.md"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[workspace.dependencies]
zmanager-apple-archive = { path = "crates/zmanager-apple-archive", version = "2.1.0" }
zmanager-cli = { path = "crates/zmanager-cli", version = "2.1.0" }
# default-features = false: the core crate has no hosted transport feature;
# hosted account/certificate behavior is composed explicitly by products that
# depend on `zmanager-tzap-hosted`.
zmanager-core = { path = "crates/zmanager-core", version = "2.1.0", default-features = false }
zmanager-tzap-hosted = { path = "crates/zmanager-tzap-hosted", version = "2.1.0" }
zmanager-ffi = { path = "crates/zmanager-ffi", version = "2.1.0" }
zmanager-unrar = { path = "crates/zmanager-unrar", version = "2.1.0" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
