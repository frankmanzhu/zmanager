name: Regenerate libarchive bindings

# Regenerates the checked-in bindgen output in
# crates/zmanager-libarchive-sys/bindings/ and auto-commits it.
#
# Runs automatically when the vendored libarchive source changes (or when
# build.rs's bindgen config changes), and manually via workflow_dispatch
# (target input lets you regenerate just one file). On push both targets are
# regenerated; the auto-commit writes only to bindings/, which is outside the
# trigger paths, so it cannot re-trigger this workflow.
#
# These files exist because static-musl build hosts (the Alpine packaging
# container) and Windows release machines cannot run bindgen (no libclang):
# see crates/zmanager-libarchive-sys/build.rs::generate_bindings.
on:
  push:
    paths:
      - "crates/zmanager-libarchive-sys/vendor/libarchive/**"
      - "crates/zmanager-libarchive-sys/build.rs"
  workflow_dispatch:
    inputs:
      target:
        description: "Which bindings to regenerate"
        type: choice
        options:
          - both
          - linux-musl
          - windows-msvc
        default: both

permissions:
  contents: write

jobs:
  linux-musl:
    name: linux-musl
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.target == 'linux-musl' || inputs.target == 'both'

    steps:
      - uses: actions/checkout@v6

      - name: Install clang and libclang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Regenerate linux-musl bindings
        run: bash scripts/generate-libarchive-bindings-linux.sh

      - name: Commit regenerated bindings
        env:
          TARGET: linux-musl
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "crates/zmanager-libarchive-sys/bindings/$TARGET.rs"
          if git diff --cached --quiet; then
            echo "No changes — $TARGET bindings are up to date"
            exit 0
          fi
          git commit -m "chore: regenerate libarchive bindings for $TARGET"
          git pull --rebase
          git push

  windows-msvc:
    name: windows-msvc
    runs-on: windows-latest
    if: github.event_name == 'push' || inputs.target == 'windows-msvc' || inputs.target == 'both'

    steps:
      - uses: actions/checkout@v6

      - name: Ensure libclang is available
        shell: pwsh
        run: |
          if (Test-Path "C:\Program Files\LLVM\bin\libclang.dll") {
            Write-Host "Using preinstalled LLVM"
            "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          } else {
            choco install llvm --no-progress -y
            "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          }

      - name: Regenerate windows-msvc bindings
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/generate-libarchive-bindings-windows.ps1

      - name: Commit regenerated bindings
        shell: bash
        env:
          TARGET: windows-msvc
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "crates/zmanager-libarchive-sys/bindings/$TARGET.rs"
          if git diff --cached --quiet; then
            echo "No changes — $TARGET bindings are up to date"
            exit 0
          fi
          git commit -m "chore: regenerate libarchive bindings for $TARGET"
          git pull --rebase
          git push
