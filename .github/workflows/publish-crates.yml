name: Publish crates.io

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4


      - name: Install Rust
        run: |
          rustup update stable
          rustup default stable

      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          crate_index_path() {
            name=$(echo "$1" | tr '[:upper:]' '[:lower:]')
            len=${#name}

            if [ "$len" -eq 1 ]; then
              echo "1/$name"
            elif [ "$len" -eq 2 ]; then
              echo "2/$name"
            elif [ "$len" -eq 3 ]; then
              echo "3/${name:0:1}/$name"
            else
              echo "${name:0:2}/${name:2:2}/$name"
            fi
          }

          is_published() {
            crate="$1"
            version="$2"

            path=$(crate_index_path "$crate")
            url="https://index.crates.io/$path"

            response=$(curl -fsSL "$url" 2>/dev/null || true)

            if [ -z "$response" ]; then
              return 1
            fi

            echo "$response" |
              jq -s -e \
                --arg version "$version" \
                'any(.[]; .vers == $version)' \
                >/dev/null
          }

          publish_if_needed() {
            crate="$1"

            version=$(cargo metadata \
              --no-deps \
              --format-version 1 \
              | jq -r --arg crate "$crate" \
                '.packages[] | select(.name == $crate) | .version')

            echo "Checking $crate v$version..."

            if is_published "$crate" "$version"; then
              echo "✓ $crate v$version already published — skipping"
            else
              echo "Publishing $crate v$version..."
              cargo publish -p "$crate"
            fi
          }

          publish_if_needed zmanager-libarchive-sys
          publish_if_needed zmanager-libarchive
          publish_if_needed zmanager-apple-archive
          publish_if_needed zmanager-unrar
          publish_if_needed zmanager-core
          publish_if_needed zmanager-ffi
          publish_if_needed zmanager-cli